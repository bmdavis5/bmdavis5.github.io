<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben Davis</title>
<meta name="description" content="Ben Davis. Email me, or book a time to talk.">
<meta name="theme-color" content="#15181d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Yellowtail&family=Barlow:wght@400;600&display=swap">
<style>
  /* Layout: one dark screen, blue bar across the top, bold first name over a script last name, four link tiles beneath. */
  :root {
    --bg: #15181d;
    --fg: #eef1f5;
    --muted: #9ba4b0;
    --tile: #232830;
    --tile-hover: #2c323c;
    --accent: #7aa7dc;
    --on-accent: #081a2e;
    --display: Oswald, "Arial Narrow", Impact, sans-serif;
    --script: Yellowtail, "Brush Script MT", cursive;
    --body: Barlow, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    border-top: 10px solid var(--accent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-inline: clamp(22px, 7vw, 96px);
    padding-block: 56px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1 { margin: 0 0 30px; font-weight: 400; }
  h1 b, h1 span { display: block; }
  h1 b { font: 700 clamp(4.4rem, 23vw, 11.5rem)/.9 var(--display); }
  h1 span {
    font: 400 clamp(4.6rem, 24vw, 12rem)/.8 var(--script);
    color: var(--accent);
    transform: rotate(-5deg);
    transform-origin: left bottom;
    margin-top: .05em;
  }
  p { color: var(--muted); max-width: 30ch; font-size: 1.1rem; line-height: 1.5; margin: 0 0 26px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; }
  .grid a { padding: 18px; border-radius: 14px; background: var(--tile); font-weight: 600; transition: background .15s ease, transform .15s ease; }
  .grid a:hover { background: var(--tile-hover); transform: translateY(-2px); }
  .grid a.hot { background: var(--accent); color: var(--on-accent); }
  .grid a.hot:hover { background: var(--accent); }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .mail { display: inline-block; margin-top: 22px; color: var(--muted); overflow-wrap: anywhere; }
  .mail:hover { color: var(--fg); }
  @media (prefers-reduced-motion: reduce) { .grid a { transition: none; } .grid a:hover { transform: none; } }
</style>
</head>
<body>
  <main>
    <h1><b>Ben</b><span>Davis</span></h1>
    <p>Email me, or book a time to talk.</p>
    <div class="grid">
      <a class="hot" href="mailto:email@benjaminmoshe.com">Email me</a>
      <a href="https://calendly.com/benmoshedavis">Book a time</a>
      <a href="https://www.linkedin.com/in/benmoshedavis">LinkedIn</a>
      <a href="https://www.instagram.com/benmoshedavis">Instagram</a>
    </div>
    <a class="mail" href="mailto:email@benjaminmoshe.com">email@benjaminmoshe.com</a>
  </main>
</body>
</html>
